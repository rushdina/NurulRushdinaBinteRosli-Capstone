name: React Vite CI/CD & Security

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: "react-vite-pages"
  cancel-in-progress: true

jobs:
  test:
    name: Run Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test:ci # Run Vitest

  security:
    name: Run Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability scanning
      - name: Run dependency audit
        run: npm audit --audit-level=high

      # Secret scanning
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Static Application Security Testing
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4

  build-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs:
      - test # Only runs if test job passes before deployment
      - security

    # PRs are tested and scanned but not deployed
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # GitHub Pages URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # Get repo files in this job's VM

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm" # speeds up builds by caching node_modules
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        # Creates dist/ folder with production-ready static files

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
        # Prepares GitHub Pages for artifact deployment

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment # reference to output url
        uses: actions/deploy-pages@v4
